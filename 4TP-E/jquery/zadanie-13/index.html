<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Zadanie 13</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function(){
            $("#klik").click(function(){
                if($("#text").val().trim() === ""){
                    $("#wiadomosc").text("To pole jest puste")
                } else {
                    $("#wiadomosc").text($("#text").val())
                }
            })
            $("#form").submit(function(e){
                e.preventDefault();
                if($("#nazwisko").val().trim() === ""){
                    $("#komunikat").text("Podaj nazwisko")
                    $("#komunikat").addClass("blad")
                    $("#komunikat").removeClass("ok")
                } else {
                    $("#komunikat").text("Wyslano formularz")
                    $("#komunikat").removeClass("blad")
                    $("#komunikat").addClass("ok")
                    $("#nazwisko").val("")
                }
            })
            $("#sprawdz").click(function(){
                console.log("xd")
                let wiek = $("#wiek").val().trim();
                if(isNaN(parseInt(wiek))){
                    $("#infoWiek").text("Wiek musi buc liczba")
                    $("#infoWiek").addClass("blad")
                    $("#infoWiek").removeClass("ok")
                } else {
                    $("#infoWiek").text("Masz " + wiek + " lat")
                    $("#infoWiek").removeClass("blad")
                    $("#infoWiek").addClass("ok")
                    $("#wiek").val("")
                }
            })
        })
    </script>
    <style>
        .ok { color: green; font-weight: bold; }
        .blad { color: crimson; font-weight: bold; }
    </style>
</head>
<body>
    <input type="text" id="text">
    <input type="button" value="kilk" id="klik">
    <p id="wiadomosc"></p>
    <hr>
    <form id="form">
        <input type="text" id="nazwisko">
        <button type="submit">Wyslij</button>
        <p id="komunikat"></p>
    </form>
    <hr>
    <input type="text" id="wiek">
    <button id="sprawdz">Sprawdz</button>
    <p id="infoWiek"></p>
</body>
</html>
