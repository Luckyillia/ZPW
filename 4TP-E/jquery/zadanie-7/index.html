<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <style>
        #jablko{
            width: 10px;
            height: 10px;
            background-color: green;
        }
    </style>
    <script src='main.js'></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <script>
        $(function(){
            $("#jablko").css({
                "marginTop":Math.floor(Math.random() * (900 - 10 + 1)) + 10,
                "marginLeft":Math.floor(Math.random() * (1910 - 10 + 1)) + 10
            })
            let positionX = 10;
            let positionY = 10;
            $(document).on("keydown keyup keypress", function(){
                
                $("#eventType").text("");
                $("#eventType").text($("#eventType").text() + event.type);
                if(event.keyCode === 39 && event.type == "keydown"){
                    positionX += 10;
                    $("#kwadrat").css("marginLeft", positionX)
                }
                if(event.keyCode === 37 && event.type == "keydown"){
                    positionX -= 10;
                    $("#kwadrat").css("marginLeft", positionX)
                }
                if(event.keyCode === 40 && event.type == "keydown"){
                    positionY += 10;
                    $("#kwadrat").css("marginTop", positionY)
                }
                if(event.keyCode === 38 && event.type == "keydown"){
                    positionY -= 10;
                    $("#kwadrat").css("marginTop", positionY)
                }
            });
            $(document).on("mousemove", function(){
                $("#pageX").text(event.pageX);
                $("#pageY").text(event.pageY);
            });
        });
    </script>
    <input type="text" id="pole">
 
    <p>
        Typ zdarzenia:
        <span id="eventType">---</span>
    </p>

    <p>
        Pozycja myszy:
        X = <span id="pageX">---</span>,
        Y = <span id="pageY">---</span>
    </p>

    <div id="kwadrat" style="width: 200px; height: 200px; background-color: red;"></div>
    <div id="jablko"></div>
</body>
</html>
